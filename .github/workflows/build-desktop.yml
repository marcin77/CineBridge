name: Build Desktop App (AppImage / exe)

# Ten workflow NIE jest częścią tego szkicu (Vite).
# Docelowo trzeba go skopiować do repo CineBridge pod ścieżką:
#   .github/workflows/build-desktop.yml
#
# Wyzwalanie:
#  - ręcznie z zakładki Actions (workflow_dispatch)
#  - przy pushu do main -> tylko build testowy (bez publikacji)
#  - przy pushu tagu w formacie v1.2.3 -> build + automatyczny Release na GitHubie
#    z podpiętymi plikami .AppImage i .exe

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: dist:linux
            artifact_name: cinebridge-linux
            artifact_glob: |
              release/*.AppImage
          - os: windows-latest
            build_cmd: dist:win
            artifact_name: cinebridge-windows
            artifact_glob: |
              release/*.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalacja zależności
        run: npm ci

      # Node/npm postinstall pobiera binarki embedded-postgres
      # dopasowane do systemu, na którym aktualnie działa runner
      # (Linux -> binarki linuksowe, Windows -> binarki win32).

      - name: Build Next.js (standalone)
        run: npm run build

      - name: Przygotuj katalog standalone (public + static)
        run: npm run electron:prepare

      - name: Build instalatora (${{ matrix.os }})
        run: npm run ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder nie publikuje sam z siebie (publish wyłączony
          # w electron-builder.yml) - upload robimy w osobnym jobie "release".

      - name: Wgraj artefakty builda
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publikacja Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz wszystkie artefakty
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Utwórz / zaktualizuj Release na GitHubie
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
