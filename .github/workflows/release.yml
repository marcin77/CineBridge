name: Release CineBridge

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-linux:
    name: 🐧 Build Linux (AppImage/deb/rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfuse2 rpm
      - run: npm ci
      - name: Build Linux packages
        run: npm run build:linux:all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  build-windows:
    name: 🪟 Build Windows Installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Setup Python 3.11 (ma distutils)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Build Windows Installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe

  build-macos:
    name: 🍎 Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build macOS DMG
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*.dmg

  release:
    name: 📦 Create GitHub Release
    needs: [ build-linux, build-windows, build-macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: release/
      - id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION_NUM="${{ steps.version.outputs.tag }}"
          VERSION_NUM="${VERSION_NUM#v}"

          echo "Szukam sekcji dla wersji: ${VERSION_NUM}"
          cat CHANGELOG.md | head -5

          NOTES=$(awk "
            /^## \[${VERSION_NUM}\]/ { flag=1; next }
            /^## \[/ { if(flag) exit }
            flag { print }
          " CHANGELOG.md | sed 's/[[:space:]]*$//' | sed '/^$/d; $d')

          if [ -z "$NOTES" ]; then
            echo "⚠️ Nie znaleziono sekcji dla ${VERSION_NUM}"
            NOTES="Brak wpisu w CHANGELOG.md dla tej wersji."
          else
            echo "✅ Znaleziono changelog:"
            echo "$NOTES"
          fi

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          name: CineBridge ${{ steps.version.outputs.tag }}
          body: |
            ## 🎬 CineBridge ${{ steps.version.outputs.tag }}

            ${{ steps.changelog.outputs.notes }}

            | System | Plik | Instalacja |
            |--------|------|------------|
            | 🐧 Linux (AppImage) | `CineBridge-*-x86_64.AppImage` | `chmod +x *.AppImage && ./CineBridge-*.AppImage` |
            | 🐧 Linux (Debian/Ubuntu) | `CineBridge-*-x86_64.deb` | `sudo dpkg -i CineBridge-*.deb` |
            | 🐧 Linux (Fedora/RHEL) | `CineBridge-*-x86_64.rpm` | `sudo rpm -i CineBridge-*.rpm` |
            | 🪟 Windows | `CineBridge-Setup-*.exe` | Uruchom instalator |
            | 🍎 macOS | `CineBridge-*.dmg` | Otwórz i przeciągnij do Applications |

            **Baza danych:** SQLite (wbudowana, nic nie trzeba instalować)
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
