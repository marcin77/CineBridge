name: Release CineBridge

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-linux:
    name: 🐧 Build AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfuse2
      - run: npm ci
      - name: Build AppImage
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*.AppImage

  build-windows:
    name: 🪟 Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Install dependencies
        run: npm ci --ignore-scripts
        shell: pwsh
      - name: Rebuild better-sqlite3 for Electron
        run: |
          $electronVersion = node -e "console.log(require('./node_modules/electron/package.json').version)"
          Write-Host "Electron version: $electronVersion"
          npx node-gyp rebuild `
            --target=$electronVersion `
            --arch=x64 `
            --dist-url=https://electronjs.org/headers `
            --directory=node_modules/better-sqlite3
        shell: pwsh
        env:
          VCINSTALLDIR: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
      - name: Build Windows Installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe

  release:
    name: 📦 Create GitHub Release
    needs: [ build-linux, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release/
      - id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          name: CineBridge ${{ steps.version.outputs.tag }}
          body: |
            ## 🎬 CineBridge ${{ steps.version.outputs.tag }}

            | System | Plik | Instalacja |
            |--------|------|------------|
            | 🐧 Linux | `CineBridge-*-x86_64.AppImage` | `chmod +x *.AppImage && ./CineBridge-*.AppImage` |
            | 🪟 Windows | `CineBridge-Setup-*.exe` | Uruchom instalator |

            **Baza danych:** SQLite (wbudowana, nic nie trzeba instalować)
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
