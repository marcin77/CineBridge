name: Build CineBridge

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: 🐧 Build AppImage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux system dependencies (dla better-sqlite3 + Electron)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            fuse

      - name: Install dependencies
        run: npm ci

      - name: Generate Drizzle migrations
        run: npm run db:generate

      - name: Build Next.js
        run: npm run build

      - name: Rebuild better-sqlite3 for Electron
        run: npm run rebuild:electron

      - name: Package AppImage
        run: npm run pack:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: CineBridge-linux
          path: dist/*.AppImage
          retention-days: 7

  build-windows:
    name: 🪟 Build Windows EXE
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Drizzle migrations
        run: npm run db:generate

      - name: Build Next.js
        run: npm run build

      - name: Rebuild better-sqlite3 for Electron
        run: npm run rebuild:electron

      - name: Package EXE
        run: npm run pack:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CineBridge-windows
          path: dist/*.exe
          retention-days: 7