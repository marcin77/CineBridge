name: Build CineBridge

on:
  push:
    branches: [ main, master, develop, development ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    name: 🐧 Build AppImage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: CineBridge-linux
          path: dist/*.AppImage
          retention-days: 7

  build-windows:
    name: 🪟 Build Windows Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install windows-build-tools
        run: |
          npm install --global --prefer-offline node-gyp@latest
          node-gyp --version
        shell: pwsh

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Install dependencies
        run: npm ci --ignore-scripts
        shell: pwsh

      - name: Rebuild better-sqlite3 manually
        run: |
          $electronVersion = node -e "console.log(require('./node_modules/electron/package.json').version)"
          Write-Host "Electron version: $electronVersion"
          npx node-gyp rebuild `
            --target=$electronVersion `
            --arch=x64 `
            --dist-url=https://electronjs.org/headers `
            --directory=node_modules/better-sqlite3
        shell: pwsh
        env:
          VCINSTALLDIR: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'

      - name: Build Windows Installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: CineBridge-windows
          path: dist/*.exe
          retention-days: 7
