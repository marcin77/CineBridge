name: Build CineBridge

on:
  push:
    branches: [ main, master, develop, development ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    name: 🐧 Build AppImage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: CineBridge-linux
          path: dist/*.AppImage
          retention-days: 7

  build-windows:
    name: 🪟 Build Windows Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Upgrade node-gyp globally
        run: npm install --global node-gyp@latest
        shell: pwsh

      - name: Install dependencies (skip scripts)
        run: npm ci --ignore-scripts
        shell: pwsh

      - name: Patch node-gyp in better-sqlite3
        run: |
          # Wymuś użycie najnowszego node-gyp w better-sqlite3
          $ngPath = "$(npm root -g)\node-gyp"
          Write-Host "Global node-gyp path: $ngPath"
          node-gyp --version
        shell: pwsh

      - name: Rebuild better-sqlite3 for Electron
        run: |
          $electronVersion = node -e "console.log(require('./node_modules/electron/package.json').version)"
          Write-Host "Electron version: $electronVersion"
          
          # Użyj globalnego node-gyp (zaktualizowanego)
          $env:npm_config_node_gyp = "$(npm root -g)\node-gyp\bin\node-gyp.js"
          
          npx --yes @electron/rebuild `
            --version $electronVersion `
            --arch x64 `
            --module-dir node_modules/better-sqlite3 `
            --only better-sqlite3
        shell: pwsh

      - name: Build Windows Installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: CineBridge-windows
          path: dist/*.exe
          retention-days: 7
