name: Build CineBridge

on:
  push:
    branches: [ main, master, develop, development ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    name: 🐧 Build Linux (AppImage/deb/rpm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfuse2 rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run build:linux:all -- --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CineBridge-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 7

  build-windows:
    name: 🪟 Build Windows Installer
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python 3.11 (ma distutils)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installer
        run: npm run build:win -- --publish never

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: CineBridge-windows
          path: dist/*.exe
          retention-days: 7

  build-macos:
    name: 🍎 Build macOS DMG
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run build:mac -- --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: CineBridge-macos
          path: dist/*.dmg
          retention-days: 7