name: Build CineBridge

on:
  push:
    branches: [ main, master, develop, development ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    name: 🐧 Build AppImage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: CineBridge-linux
          path: dist/*.AppImage
          retention-days: 7

  build-windows:
    name: 🪟 Build Windows Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (skip native compilation)
        run: npm ci --ignore-scripts

      - name: Download prebuilt better-sqlite3 for Electron
        run: |
          npx electron-builder install-app-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows Installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: CineBridge-windows
          path: dist/*.exe
          retention-days: 7
