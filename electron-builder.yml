appId: com.cinebridge.app
productName: CineBridge
copyright: Copyright © 2026 CineBridge

directories:
  output: dist
  buildResources: build

publish:
  provider: github
  owner: marcin77
  repo: CineBridge
  
files:
  - "electron/**/*"
  - "package.json"
  - "!electron/scraper/test-*.js"
  - "!**/*.map"

asarUnpack:
  - "node_modules/better-sqlite3/**/*"

# extraResources robi surowe kopiowanie plikow (bez analizy/dedupikacji
# node_modules), dzieki czemu vendorowany node_modules wewnatrz
# .next/standalone pozostaje nietkniety, a katalog jest fizycznie
# na dysku (poza asar), wiec process.chdir() dziala poprawnie.
extraResources:
  - from: ".next/standalone"
    to: "app"
    filter:
      - "**/*"
  - from: "drizzle"
    to: "drizzle"
    filter:
      - "**/*.sql"
      - "meta/_journal.json"
  - from: "build/icons"
    to: "build/icons"
    filter:
      - "*.png"

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  category: AudioVideo
  icon: build/icons/
  synopsis: Migruj historię filmową z Filmweb
  description: Scraper Filmweb + eksport do Letterboxd, Trakt, Simkl
  desktop:
    Name: CineBridge
    Comment: Migruj historię filmową z Filmweb do Letterboxd i Trakt
    Categories: AudioVideo;Video;
    StartupWMClass: CineBridge
    StartupNotify: true

appImage:
  artifactName: CineBridge-${version}-${arch}.AppImage

deb:
  artifactName: CineBridge-${version}-${arch}.deb

rpm:
  artifactName: CineBridge-${version}-${arch}.rpm

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icons/icon.ico
  artifactName: CineBridge-Setup-${version}.exe

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.video
  icon: build/icons/icon.icns
  hardenedRuntime: false

dmg:
  artifactName: CineBridge-${version}-${arch}.dmg

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
