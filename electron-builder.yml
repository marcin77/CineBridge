# Konfiguracja electron-buildera dla CineBridge.
# Docelowo plik trafia do KORZENIA repo CineBridge: electron-builder.yml
#
# Zakłada, że:
#  - next.config.ts ma ustawione: output: "standalone"
#  - przed buildem uruchomiony był `npm run electron:prepare`
#    (dokleja public/ i .next/static/ do .next/standalone)
#  - w package.json jest pole: "main": "electron/main.js"
#  - ikona aplikacji leży w build/icon.png (min. 512x512, PNG z kanałem alfa)

appId: com.marcin77.cinebridge
productName: CineBridge
copyright: "Copyright © CineBridge"

directories:
  output: release
  buildResources: build

# Do paczki .asar trafia tylko kod Electrona - reszta aplikacji
# (serwer Next.js) jest kopiowana jako "extraResources" i uruchamiana
# jako osobny proces Node.
files:
  - electron/**/*
  - package.json
  - "!**/*.map"

extraResources:
  - from: .next/standalone
    to: app-standalone
    filter:
      - "**/*"

# Natywne moduły (m.in. binarki wbudowanego Postgresa) muszą leżeć
# poza archiwum .asar, żeby dało się je uruchomić jako procesy systemowe.
asarUnpack:
  - "**/*.node"
  - "node_modules/embedded-postgres/**"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: "${productName}-${version}-Setup.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CineBridge

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: AudioVideo
  maintainer: marcin77
  executableName: cinebridge

appImage:
  artifactName: "${productName}-${version}.${ext}"

# Publikację robi krok w GitHub Actions (softprops/action-gh-release),
# więc tu wyłączamy automatyczną publikację electron-buildera.
publish: null
